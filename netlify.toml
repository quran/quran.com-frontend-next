# Next.js on Netlify — https://docs.netlify.com/integrations/frameworks/next-js/
#
# Publish MUST differ from site base (Netlify rejects publish === base).
# @netlify/plugin-nextjs may adjust the publish path during build; `.next` satisfies validation.
#
# Netlify UI (Build & deploy → Build settings):
#   Base directory: leave empty if this repo root IS the app (not a monorepo subfolder).
#   Publish directory: leave EMPTY so this file wins — do not set "." or "/" in the UI.
#
# All [build.environment] values MUST be quoted strings.
[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_PUBLIC_VERCEL_ENV = "production"
  NEXT_PUBLIC_VERCEL_URL = "chimerical-cajeta-2e6cb3.netlify.app"
  ALLOWED_ORIGINS = "quran.com,test.quran.com,chimerical-cajeta-2e6cb3.netlify.app"
  NEXT_PUBLIC_SERVER_SENTRY_ENABLED = "false"
  NEXT_PUBLIC_CLIENT_SENTRY_ENABLED = "true"
  NODE_TLS_REJECT_UNAUTHORIZED = "0"
  SIGNATURE_TOKEN = "1234"
  INTERNAL_CLIENT_ID = "QDC_WEB"
  PROXY_SIGNATURE_TOKEN = "123456"
  NEXT_PUBLIC_AUTH_PROFILE_TIMEOUT_MS = "4000"
  NEXT_PUBLIC_QURAN_REFLECT_URL = "https://quranreflect.com"
  NEXT_PUBLIC_SSO_ENABLED = "false"
  NEXT_PUBLIC_EMBED_URL = "https://quran.com/embed/v1"
  API_GATEWAY_URL = "https://api.quran.com"
  QURAN_SYNTAX_MCP_URL = "https://mcp.quran.ai/"
  NEXT_PUBLIC_SYNTAX_ANALYSIS_MOCK = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
