name: Playwright Tests
on:
  push:
    branches: [master, main, develop, testing]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [master, main, develop]
jobs:
  test_integration:
    name: Playwright Tests
    runs-on: ubuntu-latest
    if: false # Temporarily disable this workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node.js
        uses: actions/setup-node@60edb5c2436412f556447646399e9a2ab13197977a8154c68364e84a2530753
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: yarn test:integration
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@0b7084591103e87095857ee7c2cf4550d5c78b36
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
